<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag extra</title>
</head>
<body>
    <h4>Singkatan</h4>
    <p>uceng sekolah di <abbr title="Sekolah Dasar">SD</abbr>  mana sih?</p>
    <!-- <abbr title=""></abbr> buat singkatan -->

    <h4> Citation dan definisi</h4>
    <p>aku udh nonton film <cite>the dark Knight</cite></p>
    <!-- <cite></cite> buat citation -->
    <p><dfn>HTML</dfn> adalah singkatan dari HyperText Markup Language</p>
    <!-- <dfn></dfn> buat definisi -->
     

</body>
</html>
