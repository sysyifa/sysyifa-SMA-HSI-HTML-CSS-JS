<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daftar Temanku</title>
</head>
<body>
    <h1>Daftar Temanku</h1>

    {% if daftar_teman %}
        <ul>
        {% for teman in daftar_teman %}
            <li>{{ teman }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Kamu belum punya teman 😢</p>
    {% endif %}

    <a href="/">Kembali ke Home</a>
</body>
</html>
